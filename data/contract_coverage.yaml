schema_version: "nrm.contract_coverage.v2"
scope: "contract_3.2.1_to_4.2"
priority: P0
status_policy: "IMPLEMENTED means internal PRE_ACCEPTANCE only; target deployment, security and customer formal formats remain CUSTOMER_BLOCKED until supplied."
requirements:
  - requirement_id: "3.2.1"
    requirement_name: "卫星导航与惯性导航计算"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [AfsimNavigationPacketParser, NavigationAccuracyModel, NrmSimInterface, NrmCustomerJsonCodec]
    evidence: "AFSIM实时导航与.neh解析保留直接误差；GNSS/INS/INTEGRATED缺失精度按版本化1σ参数补齐，不实现真实导航积分。"
    customer_blocked: "甲方专用数据包仅在不同于AFSIM/精简JSON时需要薄适配。"
  - requirement_id: "3.2.2-protocol"
    requirement_name: "数据链协议与协议资源"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [NetworkProfileRepository, ProtocolResourceModel, ContractMetricEnricher]
    evidence: "Link-11轮询单元、Link-16时隙、卫通信道和CDL信道统一建模并上报容量/占用/剩余。"
    customer_blocked: "真实协议栈、保密波形和甲方专用事件需现场适配。"
  - requirement_id: "3.2.2-frequency"
    requirement_name: "不同频点传输特性"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [FrequencyCharacteristicRepository, PlanningRecommendationEngine]
    runtime_integration_status: COMPONENT_ONLY
    evidence: "FrequencyCharacteristicRepository独立实现并测试四网频点、范围、容量比例、附加时延和PDR特性；当前运行时频率推荐使用NetworkProfileRepository并排除占用及干扰保护带重叠，尚未绑定独立频率库。"
  - requirement_id: "3.2.3"
    requirement_name: "通信数据链能力模型"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [CommunicationCapabilityService, OperationalEnvironmentEvaluator, BuiltInEnvironmentEffectAdapter]
    evidence: "输出距离、速率、丢包、时延、吞吐、接入率及地形/气象/天象/电磁影响证据。"
  - requirement_id: "3.2.4"
    requirement_name: "网链资源规划模型"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [NetworkPlanRepository, NetworkPlanValidator, NetworkPlanEvaluationService, NetworkPlanDistributionService, NetworkPlanCoordinationService]
    evidence: "空中/地面/联合规划域、版本化规划、并发推演、动态入退网、本地分发包和指纹ACK。"
  - requirement_id: "3.2.5"
    requirement_name: "网链资源管理模型"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [ResourceDemandRepository, ResourceDemandMatchingService, ResourceDemandCoordinator, PlanningRecommendationEngine]
    evidence: "资源状态获取、并发需求匹配、四类反馈、历史通过率及频率/站点/信道/子网/时隙/路由六类建议。"
  - requirement_id: "3.3"
    requirement_name: "接口要求"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [ContractInterfaceAdapter, CustomerNrmAdapter, CustomerJsonCodec, CustomerJsonValidationLayer, CustomerIngestionState, ModelServiceFacade]
    evidence: "CustomerNrmAdapter提供同进程资源/导航/环境更新及评估/规划/需求强类型入口；明确networkId/platformId主键、三域合并、三态环境语义及有界生命周期；13类精简JSON作为字段合同、文件、测试和回放工具，并通过DataContainer真实入口端到端测试。"
    customer_blocked: "甲方私有对象头文件、字段映射和ABI未提供；取得后只实现ContractInterfaceAdapter薄转换。"
  - requirement_id: "3.4.1"
    requirement_name: "软件运行环境"
    implementation_status: IMPLEMENTED
    verification_status: CONDITIONAL
    components: [check_deployment_contract.sh]
    evidence: "只读检查CPU、内存、磁盘、网卡、Linux、编译器、AFSIM和插件并生成nrm.deployment_check.v1。"
    customer_blocked: "OA、保密、TLS和甲方门户规范未提供，固定标记CUSTOMER_BLOCKED。"
  - requirement_id: "3.4.2"
    requirement_name: "易用性与异常恢复"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [NrmDockWidget, SnapshotReporter, RecoveryStateStore]
    runtime_integration_status: RECOVERY_COMPONENT_ONLY
    evidence: "响应式中文界面、有界异步上报和runId隔离已接入运行时；RecoveryStateStore具备原子保存与损坏状态保护并通过独立测试，但启动恢复策略待甲方确认后接入。"
  - requirement_id: "3.5"
    requirement_name: "兼容扩展"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [ModelRegistry, ReferenceModelAdapter]
    runtime_integration_status: REFERENCE_FIXTURE_ONLY
    evidence: "ReferenceModelAdapter作为兼容性测试样例，可在ModelRegistry注册、查询能力/Schema、健康检查并卸载；它不是已部署的第三方模块。"
    customer_blocked: "不宣称符合尚未提供的甲方正式模型封装ABI。"
  - requirement_id: "4.1-4.2"
    requirement_name: "设计原则与约束"
    implementation_status: IMPLEMENTED
    verification_status: PRE_ACCEPTANCE
    components: [ResourceSnapshot, ModelServiceFacade, SnapshotReporter, DegradationPolicy]
    evidence: "公共纯C++核心与AFSIM/Qt边界分离；只读建议，不自动改频、建链或切换路由。"
