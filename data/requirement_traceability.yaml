    internal_fields: ["member_name"]
    data_source: "平台/端点对象"
    calculation_method: "直接读取"
    ui_location: ["成员明细"]
    report_fields: ["member_name"]
    acceptance_case: "A01"
  - requirement_id: 9
    requirement_name: "成员编号"
    internal_fields: ["member_id"]
    data_source: "平台索引/网络地址/配置"
    calculation_method: "版本化编号映射"
    ui_location: ["成员明细"]
    report_fields: ["member_id"]
    acceptance_case: "A01"
  - requirement_id: 10
    requirement_name: "成员职责"
    internal_fields: ["member_role", "role_source"]
    data_source: "场景配置/适配器"
    calculation_method: "显式职责映射"
    ui_location: ["成员明细"]
    report_fields: ["member_role"]
