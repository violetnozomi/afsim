schema_version: "nrm.requirement_traceability.v1"
priority: P0
v070_implementation_evidence:
  status: PRE_ACCEPTANCE
  requirement_ids: [2, 4, 5, 6, 11, 12, 16, 19, 20, 22, 24, 26, 27, 28, 30]
  components: [NetworkProfileRepository, MessageLifecycleTracker, ResourceEventLedger, ConstrainedPathSelector, SnapshotReporter]
  tests: [nrm_network_profile_test, nrm_message_lifecycle_tracker_test, nrm_resource_event_ledger_test, nrm_constrained_path_selector_test, nrm_snapshot_reporter_recovery_test]
  scenarios: [link_failure, congestion, quality_degradation]
  limitations:
    - "内部演示剖面和模拟故障输入，不是甲方接口最终验收。"
    - "真实协议建链事件、组播重传语义、跨网网关和独立资源事件JSONL尚未完成。"
v080_capability_evidence:
  status: PRE_ACCEPTANCE
  contract_requirement: "3.2.3"
  requirement_ids: [3, 11, 14, 16, 17, 22, 23, 26]
  components: [CommunicationCapabilityService, EnvironmentEffectAdapter, SnapshotReporter]
  test: nrm_communication_capability_service_test
  scenario: capability_service_smoke
  report_schema: nrm.capability.v1
  limitations:
    - "地形、气象、天象和电磁干扰只有抽象接口；甲方格式缺失时固定无效。"
    - "内部网络剖面和固定场景不构成甲方最终验收。"
v090_network_plan_evidence:
  status: PRE_ACCEPTANCE
  contract_requirement: "3.2.4"
  components: [NetworkPlanRepository, NetworkPlanValidator, NetworkPlanEvaluationService, NetworkPlanDistributionService, NetworkPlanAdapter, SnapshotReporter]
  tests: [nrm_network_plan_repository_test, nrm_network_plan_evaluation_test]
  scenario_status: NOT_CREATED_NO_SAFE_SERVICE_ENTRY
  schemas: [nrm.network_plan.v1, nrm.network_plan_validation.v1, nrm.network_plan_evaluation.v1, nrm.network_plan_distribution.v1]
  limitations:
    - "使用内部NRM_NETWORK_PLAN_V1格式，不代表甲方正式规划文件格式。"
    - "仅生成本地不可变分发包，不连接真实分发协议或控制AFSIM网络。"
    - "现有AFSIM脚本无安全规划服务调用入口，未以普通消息场景伪造服务证据。"
requirements:
  - requirement_id: 1
    requirement_name: "链路名称"
    internal_fields: ["link_name"]
    data_source: "网络与端点配置"
    calculation_method: "显式配置或稳定标识推导"
    ui_location: ["四网总览", "链路明细"]
    report_fields: ["link_name"]
    acceptance_case: "A01"
  - requirement_id: 2
    requirement_name: "链路可用性"
    internal_fields: ["effective_online_state", "service_availability"]
    data_source: "分维度状态/业务门限"
    calculation_method: "状态机求有效在线；按条件满足时间积分"
    ui_location: ["四网总览", "链路明细"]
    report_fields: ["availability_metrics"]
    acceptance_case: "A02"
  - requirement_id: 3
    requirement_name: "组网规模"
    internal_fields: ["current_member_count", "online_member_count", "max_supported_members"]
    data_source: "WsfCommNetworkManager/模板"
    calculation_method: "成员统计与配置上限"
    ui_location: ["四网总览"]
    report_fields: ["member_counts"]
    acceptance_case: "A01"
  - requirement_id: 4
    requirement_name: "链路脱网时长"
    internal_fields: ["current_offline_duration", "window_offline_duration"]
    data_source: "状态事件"
    calculation_method: "状态区间积分"
    ui_location: ["链路明细", "告警"]
    report_fields: ["offline_duration"]
    acceptance_case: "A08"
  - requirement_id: 5
    requirement_name: "建链成功率"
    internal_fields: ["establishment_success_ratio"]
    data_source: "统一建链事件"
    calculation_method: "成功次数/尝试次数"
    ui_location: ["链路明细"]
    report_fields: ["establishment_success_ratio"]
    acceptance_case: "A07"
  - requirement_id: 6
    requirement_name: "建链时长"
    internal_fields: ["establishment_delay"]
    data_source: "统一建链事件"
    calculation_method: "成功时间-尝试时间"
    ui_location: ["链路明细"]
    report_fields: ["establishment_delay"]
    acceptance_case: "A07"
  - requirement_id: 7
    requirement_name: "链路工作状态"
    internal_fields: ["state"]
    data_source: "WsfCommObserver"
    calculation_method: "设备/链路/协议状态聚合"
    ui_location: ["四网总览", "拓扑"]
    report_fields: ["link_state"]
    acceptance_case: "A03"
  - requirement_id: 8
